<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=800" />
    <title>{{NAME}} showreel</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --accent: {{ACCENT}};
        --bg: #0a0a0a;
      }
      body { margin: 0; background: var(--bg); }
      #root {
        position: relative;
        width: 1280px;
        height: 800px;
        overflow: hidden;
        background: var(--bg);
        font-family: system-ui, sans-serif;
      }
      .clip { position: absolute; inset: 0; }

      /* Ambient glow in the project's accent colour */
      #glow {
        position: absolute;
        left: 50%; top: 55%;
        width: 1400px; height: 1000px;
        margin: -500px 0 0 -700px;
        background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 28%, transparent), transparent 70%);
        filter: blur(10px);
        opacity: 0.9;
      }
      #grain {
        position: absolute; inset: 0;
        background-image: radial-gradient(rgba(255,255,255,0.045) 0.6px, transparent 0.6px);
        background-size: 3px 3px;
        mix-blend-mode: overlay;
        pointer-events: none;
      }

      #stage {
        position: absolute; inset: 0;
        perspective: 1800px;
        perspective-origin: 50% 45%;
      }
      #stage > * { transform-style: preserve-3d; }

      /* Desktop browser window */
      #win {
        position: absolute;
        left: 120px; top: 75px;
        width: 1040px; height: 650px;
        border-radius: 14px;
        background: #141414;
        box-shadow:
          0 1px 0 rgba(255,255,255,0.08) inset,
          0 40px 90px -20px rgba(0,0,0,0.75),
          0 0 0 1px rgba(255,255,255,0.06);
        overflow: hidden;
        will-change: transform;
      }
      #win .bar {
        height: 34px;
        display: flex; align-items: center; gap: 8px;
        padding: 0 14px;
        background: #1c1c1c;
        border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      #win .bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3a3a; display: block; }
      #win .bar .url {
        margin-left: 14px; flex: 1; height: 20px; border-radius: 6px;
        background: #262626;
        color: #b0b0b0; font-size: 11px; line-height: 20px; padding: 0 10px;
        letter-spacing: 0.01em;
      }
      .screen { position: relative; overflow: hidden; background: #fff; }
      #win .screen { height: 616px; }
      .screen img { display: block; width: 100%; height: auto; will-change: transform; }

      /* Phones */
      .phone {
        position: absolute;
        width: 250px; height: 520px;
        border-radius: 34px;
        background: #0f0f0f;
        padding: 10px;
        box-sizing: border-box;
        box-shadow:
          0 0 0 1px rgba(255,255,255,0.10),
          0 0 0 6px #1a1a1a,
          0 50px 80px -20px rgba(0,0,0,0.8);
        will-change: transform;
      }
      .phone .screen { height: 100%; border-radius: 26px; }
      .phone .notch {
        position: absolute; left: 50%; top: 18px;
        width: 86px; height: 22px; margin-left: -43px;
        border-radius: 12px; background: #0f0f0f; z-index: 2;
      }
      #ph1 { left: 700px; top: 150px; }
      #ph2 { left: 960px; top: 230px; }

      #veil { position: absolute; inset: 0; background: var(--bg); opacity: 0; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="showreel" data-start="0" data-duration="12" data-fps="30" data-width="1280" data-height="800">
      <div id="backdrop" class="clip" data-start="0" data-duration="12" data-track-index="0">
        <div id="glow"></div>
        <div id="grain"></div>
      </div>

      <div id="stage" class="clip" data-start="0" data-duration="12" data-track-index="1">
        <div id="win">
          <div class="bar"><i></i><i></i><i></i><span class="url">{{URL}}</span></div>
          <div class="screen"><img id="win-img" src="shots/{{ID}}-desktop.webp" alt="" /></div>
        </div>

        <!--phones-->
        <div id="ph1" class="phone">
          <div class="notch"></div>
          <div class="screen"><img id="ph1-img" src="shots/{{PHONE}}-phone.webp" alt="" /></div>
        </div>
        <div id="ph2" class="phone">
          <div class="notch"></div>
          <div class="screen"><img id="ph2-img" src="shots/{{PHONE}}-phone.webp" alt="" /></div>
        </div>
        <!--/phones-->
      </div>

      <div id="veil" class="clip" data-start="0" data-duration="12" data-track-index="2"></div>
    </div>

    <script>
      // Three beats over 12s, ending in the same framing it started with so
      // the clip loops cleanly: (A) desktop scroll, (B) desktop + two phones in
      // perspective, (C) push-in on the desktop, then a short dip to the backdrop.
      const tl = gsap.timeline({ paused: true });

      // Continuous ambient motion
      tl.fromTo("#glow", { scale: 0.85, x: -60 }, { scale: 1.15, x: 60, duration: 12, ease: "sine.inOut" }, 0);

      // Open from the veil
      tl.fromTo("#veil", { opacity: 1 }, { opacity: 0, duration: 0.7, ease: "power2.out" }, 0);

      // Scroll offsets in px, computed by build.mjs from each screenshot's height.
      const S = {{SCROLL}};
      const PHONES = {{HAS_PHONES}};

      // (A) 0 – 4.4s : window settles, page scrolls
      tl.fromTo("#win",
        { y: 90, opacity: 0, rotateX: 12, scale: 0.9, transformOrigin: "50% 42%" },
        { y: 0, opacity: 1, rotateX: 0, scale: 0.96, duration: 1.1, ease: "power3.out" }, 0.1);
      tl.fromTo("#win-img", { y: 0 }, { y: -S.a, duration: 3.8, ease: "power2.inOut" }, 0.7);

      // (B) 4.4 – 8.6s : window tilts; phones join when the project has a mobile capture
      if (PHONES) {
        tl.set(["#ph1", "#ph2"], { x: 560, y: 140, opacity: 0, rotateY: -12 }, 0);
        tl.to("#win", { x: -175, rotateY: 13, scale: 0.74, duration: 1.3, ease: "power3.inOut" }, 4.4);
        tl.to("#ph1", { x: 0, y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 4.7);
        tl.to("#ph2", { x: 0, y: 0, opacity: 1, duration: 1.1, ease: "power3.out" }, 4.9);
        tl.fromTo("#ph1-img", { y: 0 }, { y: -S.p1, duration: 3.8, ease: "power1.inOut" }, 5.2);
        tl.fromTo("#ph2-img", { y: -S.p2a }, { y: -S.p2b, duration: 3.8, ease: "power1.inOut" }, 5.2);
        tl.to("#ph1", { y: -14, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 1 }, 5.9);
        tl.to("#ph2", { y: 12, duration: 1.1, ease: "sine.inOut", yoyo: true, repeat: 1 }, 6.1);
        tl.to("#ph1", { x: 600, opacity: 0, duration: 0.8, ease: "power3.in" }, 8.4);
        tl.to("#ph2", { x: 600, opacity: 0, duration: 0.8, ease: "power3.in" }, 8.5);
      } else {
        tl.to("#win", { rotateY: -14, rotateX: 6, scale: 0.84, duration: 1.4, ease: "power3.inOut" }, 4.4);
        tl.to("#win", { rotateY: 12, rotateX: 4, duration: 2.8, ease: "sine.inOut" }, 5.8);
      }
      tl.to("#win-img", { y: -S.b, duration: 4.0, ease: "sine.inOut" }, 4.6);

      // (C) 8.6 – 12s : push into the desktop page
      tl.to("#win", { x: 0, rotateY: 0, rotateX: 0, scale: 1.42, duration: 1.5, ease: "power3.inOut" }, 8.7);
      tl.to("#win-img", { y: -S.c, duration: 3.3, ease: "sine.inOut" }, 8.7);

      // Dip to the backdrop so the loop restarts from the same place
      tl.to("#veil", { opacity: 1, duration: 0.6, ease: "power2.in" }, 11.4);

      window.__timelines = window.__timelines || {};
      window.__timelines.showreel = tl;
    </script>
  </body>
</html>
